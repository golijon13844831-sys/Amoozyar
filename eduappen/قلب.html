<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مدافع قلب — ماجرای زیست دهم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0708;font-family:Tahoma,Arial,sans-serif;user-select:none;color:#fff}
canvas{display:block}
.hidden{display:none!important}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 50%,rgba(20,0,5,.55) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:16;opacity:.05;animation:grain .5s steps(4) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:40px -70px}75%{background-position:-30px -30px}100%{background-position:70px 60px}}
#hurtFx{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,25,25,.55) 100%);transition:opacity .08s}
#lowHpFx{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(200,0,0,.6) 100%)}
#lowHpFx.on{animation:lowPulse 1s ease-in-out infinite}
@keyframes lowPulse{0%,100%{opacity:.15}50%{opacity:.55}}
#flashFx{position:fixed;inset:0;background:#ffeef0;opacity:0;pointer-events:none;z-index:17;transition:opacity .08s}
#dmgDir{position:fixed;top:50%;left:50%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;z-index:9}
#dmgDir::before{content:'';position:absolute;top:-16px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:13px solid rgba(255,55,55,.9);filter:drop-shadow(0 0 7px rgba(255,55,55,.9));opacity:0}
#dmgDir.show::before{animation:dmgdir .75s ease-out forwards}
@keyframes dmgdir{0%{opacity:1}100%{opacity:0}}
#scopeOverlay{position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle at center,transparent 25%,rgba(0,0,0,.97) 26%)}
#scopeOverlay::before,#scopeOverlay::after{content:'';position:absolute;background:rgba(140,235,255,.55)}
#scopeOverlay::before{top:50%;left:20%;right:20%;height:1px}
#scopeOverlay::after{left:50%;top:20%;bottom:20%;width:1px}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;pointer-events:none;z-index:10;transition:opacity .15s}
#crosshair .dot{position:absolute;top:50%;left:50%;width:3px;height:3px;background:#8cebff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(140,235,255,.9)}
#crosshair .line{position:absolute;background:rgba(140,235,255,.85)}
#crosshair .line.t{top:0;left:50%;width:2px;height:9px;transform:translateX(-50%)}
#crosshair .line.b{bottom:0;left:50%;width:2px;height:9px;transform:translateX(-50%)}
#crosshair .line.l{left:0;top:50%;width:9px;height:2px;transform:translateY(-50%)}
#crosshair .line.r{right:0;top:50%;width:9px;height:2px;transform:translateY(-50%)}
#hitmarker{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;pointer-events:none;opacity:0;z-index:10;transition:opacity .12s}
#hitmarker.show{opacity:1}
#hitmarker::before,#hitmarker::after{content:'';position:absolute;width:100%;height:3px;background:#ff4d4d;top:50%;left:0;box-shadow:0 0 8px rgba(255,80,80,.9)}
#hitmarker::before{transform:translateY(-50%) rotate(45deg)}
#hitmarker::after{transform:translateY(-50%) rotate(-45deg)}
#reloadWrap{position:fixed;top:57%;left:50%;transform:translateX(-50%);width:130px;z-index:10;pointer-events:none;text-align:center}
#reloadWrap span{color:#8cebff;font-size:10px;letter-spacing:2px}
#reloadWrap .rb{width:100%;height:4px;background:rgba(20,30,45,.8);border-radius:3px;margin-top:3px;overflow:hidden}
#reloadFill{height:100%;width:0;background:linear-gradient(90deg,#6fd3ff,#8cebff)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:95vw}
.chip{background:rgba(22,10,14,.85);border:1px solid rgba(190,120,140,.3);color:#dcc8d0;padding:4px 9px;border-radius:8px;font-size:11px;backdrop-filter:blur(6px);white-space:nowrap}
.chip b{color:#6fd3ff;font-size:12.5px;margin:0 2px}
.chip.gold b{color:#ffc93c}
#bottomLeft{position:absolute;bottom:20px;left:20px;display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:7px}
.lbl{color:#b08a98;font-size:10.5px;width:42px}
.bar{width:170px;height:11px;background:rgba(16,8,10,.85);border:1px solid rgba(190,120,140,.3);border-radius:6px;overflow:hidden}
.bar>div{height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#2ee06a,#7bff9c)}
.val{color:#e6f0ff;font-size:11.5px;min-width:28px;font-weight:bold}
#bottomRight{position:absolute;bottom:20px;right:20px;background:rgba(22,10,14,.85);border:1px solid rgba(190,120,140,.25);border-radius:10px;padding:7px 15px;text-align:center;backdrop-filter:blur(6px);min-width:105px}
#bottomRight .wname{color:#b08a98;font-size:10px;margin-bottom:2px;letter-spacing:.5px}
#bottomRight .ammo{color:#e6f0ff;font-size:17px;font-weight:bold}
#bottomRight .ammo.low{color:#ff6b6b}
#bottomRight .ammo .sep{color:#6a4a55;margin:0 3px}
#bottomRight .ammo .res{color:#b08a98;font-size:13px}
#abilities{position:absolute;bottom:76px;right:20px;display:flex;gap:5px}
.ab{background:rgba(22,10,14,.85);border:1px solid rgba(190,120,140,.3);border-radius:8px;padding:4px 8px;text-align:center;min-width:52px;transition:all .15s;opacity:.55}
.ab.ready{opacity:1;border-color:rgba(111,211,255,.75);box-shadow:0 0 10px rgba(111,211,255,.3)}
.ab .abk{color:#b08a98;font-size:9px}
.ab .abn{color:#e6f0ff;font-size:10.5px;font-weight:bold;margin-top:1px}
.ab .abcd{color:#6fd3ff;font-size:9.5px;margin-top:1px;font-weight:bold}
#powerups{position:absolute;top:245px;left:20px;display:flex;flex-direction:column;gap:4px}
.pw{background:rgba(22,10,14,.85);border:1px solid rgba(255,220,80,.4);border-radius:7px;padding:3px 8px;color:#ffc93c;font-size:10.5px}
#killfeed{position:absolute;top:58px;right:20px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.kf{background:rgba(22,10,14,.85);border:1px solid rgba(190,120,140,.25);border-radius:6px;padding:3px 8px;color:#e6f0ff;font-size:11px;backdrop-filter:blur(6px);animation:kfIn .2s;white-space:nowrap}
@keyframes kfIn{from{opacity:0;transform:translateX(20px)}}
.kf b{color:#6fd3ff}.kf .red{color:#ff6b6b}.kf .green{color:#4fe08a}
#chatBox{position:absolute;bottom:158px;left:20px;width:290px;max-height:160px;background:rgba(8,4,6,.85);border:1px solid rgba(190,120,140,.3);border-radius:10px;padding:6px 10px;font-size:11px;color:#dcc8d0;overflow-y:auto;display:none;backdrop-filter:blur(6px);pointer-events:auto}
#chatBox.show{display:block}
#chatBox .cm{margin-bottom:2px}
#chatBox .cm b{color:#6fd3ff}
#chatInput{position:absolute;bottom:128px;left:20px;width:290px;background:rgba(8,4,6,.95);border:1px solid rgba(190,120,140,.5);color:#eaf4ff;border-radius:9px;padding:7px 11px;font-size:12px;font-family:inherit;outline:none;display:none;pointer-events:auto}
#chatInput.show{display:block}
#damageNumbers{position:fixed;inset:0;pointer-events:none;z-index:14}
.dmgNum{position:absolute;color:#ff9c2e;font-weight:bold;font-size:15px;text-shadow:0 0 6px rgba(0,0,0,.9);animation:dmgFloat 1s ease-out forwards;pointer-events:none}
.dmgNum.crit{color:#ffd24a;font-size:20px}
@keyframes dmgFloat{from{transform:translateY(0);opacity:1}to{transform:translateY(-42px);opacity:0}}
#toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(.85);color:#eaf4ff;font-size:25px;font-weight:bold;text-align:center;text-shadow:0 0 30px rgba(255,90,120,.55);pointer-events:none;opacity:0;transition:all .3s;z-index:15;line-height:1.7}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:14px;color:#cfb0ba;font-weight:normal;margin-top:4px}
#subtitle{position:fixed;bottom:128px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 15px;border-radius:8px;font-size:14px;z-index:12;pointer-events:none;opacity:0;transition:opacity .3s}
#hint{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:rgba(30,60,40,.85);border:1px solid rgba(120,220,140,.5);color:#b8ffc8;padding:5px 14px;border-radius:9px;font-size:12.5px;z-index:12;pointer-events:none;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#achievePop{position:fixed;top:98px;right:20px;background:linear-gradient(135deg,rgba(60,100,60,.95),rgba(30,60,30,.95));border:1px solid rgba(120,220,120,.5);border-radius:10px;padding:9px 13px;color:#eaf4ff;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translateX(420px);transition:transform .4s;z-index:25;max-width:270px}
#achievePop.show{transform:translateX(0)}
#achievePop .at{color:#8ef0a8;font-size:10px;margin-bottom:2px}
#achievePop .an{font-weight:bold;font-size:13px}
#minimapWrap{position:absolute;top:56px;left:20px;text-align:center}
#minimap{width:140px;height:140px;border-radius:50%;background:rgba(14,6,9,.72);border:2px solid rgba(255,120,140,.35);box-shadow:0 0 18px rgba(0,0,0,.5)}
#ecg{width:230px;height:22px;margin-top:5px;background:rgba(8,4,6,.6);border:1px solid rgba(190,120,140,.25);border-radius:6px}
#examPanel{position:absolute;top:26%;left:20px;width:300px;background:rgba(14,8,12,.88);border:1px solid rgba(255,180,90,.4);border-radius:11px;padding:10px 13px;backdrop-filter:blur(6px)}
#examPanel .eq{color:#ffd8a8;font-size:12.5px;font-weight:bold;line-height:1.8}
#examPanel .eo{margin-top:7px;color:#dcc8d0;font-size:11.5px;line-height:2.1;text-align:right}
#examPanel .eo b{color:#6fd3ff}
#examPanel .es{margin-top:6px;color:#8ef0a8;font-size:10.5px}
#bossBar{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:340px;background:rgba(22,10,14,.88);border:1px solid rgba(255,80,80,.45);border-radius:9px;padding:5px 12px;backdrop-filter:blur(6px)}
#bossBar .bn{color:#ff8f8f;font-size:11px;font-weight:bold;text-align:center;letter-spacing:1px}
#bossBar .bb{height:9px;background:rgba(40,10,14,.8);border-radius:5px;margin-top:3px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3355,#ff8f8f);transition:width .2s}
#killstreakEl{position:absolute;top:104px;left:50%;transform:translateX(-50%);color:#ffc93c;font-size:16px;font-weight:bold;text-shadow:0 0 18px rgba(255,200,60,.7);opacity:0;transition:opacity .3s}
#killstreakEl.show{opacity:1}
#comboEl{position:fixed;top:56%;left:56%;color:#6fd3ff;font-size:15px;font-weight:bold;text-shadow:0 0 12px rgba(111,211,255,.8);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#comboEl.show{opacity:1}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(40,16,24,.92),rgba(0,0,0,.96));z-index:20;padding:18px;overflow-y:auto;transition:opacity .3s}
#overlay.hide{opacity:0;pointer-events:none}
.panel{background:linear-gradient(160deg,rgba(34,16,22,.97),rgba(14,7,10,.99));border:1px solid rgba(255,140,160,.25);border-radius:16px;padding:22px 28px;text-align:center;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.7);max-height:92vh;overflow-y:auto;width:100%}
.panel h1{color:#eaf4ff;font-size:24px;margin-bottom:8px;text-shadow:0 0 26px rgba(255,90,120,.5)}
.panel h2{color:#eaf4ff;font-size:19px;margin-bottom:8px}
.panel h3{color:#cfb0ba;font-size:12px;margin:13px 0 6px;text-align:right}
.panel p{color:#b9a0ab;font-size:12px;line-height:1.9;margin-bottom:10px}
.panel input{background:rgba(16,8,12,.85);border:1px solid rgba(190,120,140,.35);color:#eaf4ff;border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:inherit;width:100%;margin-bottom:6px;text-align:center;outline:none}
.panel input:focus{border-color:rgba(111,211,255,.75)}
.panel button{background:linear-gradient(180deg,#d84f5f,#a02030);color:#fff;border:none;border-radius:9px;padding:8px 18px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:bold;box-shadow:0 6px 16px rgba(210,60,90,.4);transition:transform .12s;margin:2px}
.panel button:hover{transform:translateY(-2px)}
.panel button.alt{background:linear-gradient(180deg,#4a3a44,#2a2028)}
.panel button.gold{background:linear-gradient(180deg,#d8a72f,#a07a1e)}
.panel button.danger{background:linear-gradient(180deg,#c04545,#7a2020)}
.panel button:disabled{opacity:.35;cursor:not-allowed;transform:none}
.statline{color:#b08a98;font-size:11.5px;margin-bottom:4px}
.statline b{color:#6fd3ff;font-size:13.5px}
.statline.gold b{color:#ffc93c}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.pick{background:rgba(30,14,20,.7);border:2px solid rgba(190,120,140,.2);border-radius:9px;padding:7px;cursor:pointer;transition:all .15s;text-align:right;font-size:11px}
.pick:hover{border-color:rgba(111,211,255,.5)}
.pick.sel{border-color:#6fd3ff;background:rgba(30,60,100,.7)}
.pick .pn{color:#eaf4ff;font-weight:bold}
.pick .pd{color:#b08a98;font-size:9.5px;margin-top:2px}
.mode-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.mbtn{background:rgba(30,14,20,.7);border:1px solid rgba(190,120,140,.25);border-radius:7px;padding:5px 9px;color:#dcc8d0;font-size:10.5px;cursor:pointer}
.mbtn.sel{background:rgba(200,60,90,.5);color:#fff;border-color:#ff8f9f}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.shop-item{background:rgba(30,14,20,.7);border:1px solid rgba(190,120,140,.2);border-radius:9px;padding:8px;text-align:right;font-size:11px}
.shop-item .sn{color:#eaf4ff;font-weight:bold}
.shop-item .sd{color:#b08a98;font-size:9.5px;margin:2px 0 5px}
.shop-item .sp{color:#ffc93c;font-weight:bold}
.shop-item button{padding:4px 10px;font-size:10px;margin:0}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;color:#dcc8d0;font-size:12px;text-align:right}
.slider-row label{min-width:105px}
.slider-row input[type=range]{flex:1;accent-color:#6fd3ff}
.slider-row .v{color:#6fd3ff;font-weight:bold;min-width:42px;text-align:left}
.slider-row select{background:rgba(16,8,12,.9);color:#eaf4ff;border:1px solid rgba(190,120,140,.35);border-radius:6px;padding:3px 6px;font-family:inherit}
.lb-row{display:flex;justify-content:space-between;background:rgba(30,14,20,.6);border-radius:7px;padding:5px 11px;font-size:11.5px;margin-bottom:3px;color:#dcc8d0}
.lb-row b{color:#6fd3ff}
.lb-row.me{border:1px solid rgba(255,201,60,.5)}
.ach-row{display:flex;justify-content:space-between;align-items:center;background:rgba(30,14,20,.6);border-radius:7px;padding:6px 11px;font-size:11px;margin-bottom:3px}
.ach-row.done{border:1px solid rgba(120,220,120,.4)}
.ach-row .an2{color:#eaf4ff;font-weight:bold}
.ach-row .ad{color:#b08a98;font-size:9.5px}
.ach-row .st{font-size:16px}
.sk-row{display:flex;align-items:center;justify-content:space-between;background:rgba(30,14,20,.6);border-radius:8px;padding:6px 11px;margin-bottom:4px;font-size:11.5px}
.sk-row .pips{color:#6fd3ff;letter-spacing:2px;direction:ltr}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0d0708;z-index:30;color:#eaf4ff;font-size:15px}
.spinner{width:44px;height:44px;border:3px solid rgba(255,120,140,.2);border-top-color:#ff8f9f;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.mobile #crosshair{display:none!important}
body.mobile #bottomLeft{bottom:170px}
body.mobile #bottomRight{bottom:170px;right:auto;left:20px}
body.mobile #abilities{bottom:170px;left:150px;right:auto}
body.mobile #examPanel{left:auto;right:20px;top:22%}
.joystick{position:fixed;bottom:26px;width:115px;height:115px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);touch-action:none;z-index:11}
.joystick.left{left:24px}.joystick.right{right:24px}
.joystick .knob{position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%);pointer-events:none}
.mob-btn{position:fixed;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;touch-action:none;z-index:11;font-weight:bold}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div>در حال ساخت قلب… 🫀</div></div>

<div id="vignette"></div><div id="grain"></div><div id="hurtFx"></div><div id="lowHpFx"></div><div id="flashFx"></div>
<div id="scopeOverlay" class="hidden"></div>
<div id="dmgDir"></div>

<div id="crosshair" class="hidden"><div class="dot"></div><div class="line t"></div><div class="line b"></div><div class="line l"></div><div class="line r"></div></div>
<div id="hitmarker"></div>
<div id="reloadWrap" class="hidden"><span>RELOADING</span><div class="rb"><div id="reloadFill"></div></div></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <div class="chip">حالت <b id="modeEl">دفاع قلبی</b></div>
    <div class="chip">مرحله <b id="roundEl">1</b></div>
    <div class="chip">میکروب <b id="enemyEl">0</b></div>
    <div class="chip">امتیاز <b id="scoreEl">0</b></div>
    <div class="chip hidden" id="timeChip">زمان <b id="timeEl">0:00</b></div>
    <div class="chip">دانش <b id="levelEl">1</b></div>
    <div class="chip gold">⚡ <b id="coinEl">0</b></div>
    <div class="chip hidden" id="fpsChip">FPS <b id="fpsEl">60</b></div>
  </div>
  <div id="minimapWrap"><canvas id="minimap" width="140" height="140"></canvas><canvas id="ecg" width="230" height="22"></canvas></div>
  <div id="bossBar" class="hidden"><div class="bn">لخته خون</div><div class="bb"><div id="bossFill"></div></div></div>
  <div id="killstreakEl"></div>
  <div id="examPanel" class="hidden"><div class="eq" id="examQ"></div><div class="eo" id="examOpts"></div><div class="es" id="examScore"></div></div>
  <div id="powerups"></div>
  <div id="killfeed"></div>
  <div id="bottomLeft">
    <div class="bar-row"><span class="lbl">سلامت</span><div class="bar"><div id="hpFill"></div></div><span class="val" id="hpVal">100</span></div>
    <div class="bar-row"><span class="lbl">پلاکت</span><div class="bar"><div id="arFill" style="background:linear-gradient(90deg,#4fa8ff,#9ed4ff)"></div></div><span class="val" id="arVal">0</span></div>
    <div class="bar-row"><span class="lbl">دانش</span><div class="bar"><div id="xpFill" style="background:linear-gradient(90deg,#ffc93c,#ff9c2e)"></div></div><span class="val" id="xpVal">1</span></div>
    <div class="bar-row"><span class="lbl">استقامت</span><div class="bar"><div id="stFill" style="background:linear-gradient(90deg,#6fd3ff,#a8e6ff)"></div></div><span class="val" id="stVal">100</span></div>
  </div>
  <div id="abilities">
    <div class="ab" id="abDash"><div class="abk">Shift</div><div class="abn">جریان خون</div><div class="abcd">✓</div></div>
    <div class="ab" id="abHeal"><div class="abk">E</div><div class="abn">ترمیم</div><div class="abcd">✓</div></div>
    <div class="ab" id="abUlt"><div class="abk">Q</div><div class="abn">آلتیمت</div><div class="abcd">✓</div></div>
    <div class="ab hidden" id="abTurret"><div class="abk">T</div><div class="abn">سلول حافظه</div><div class="abcd">✓</div></div>
    <div class="ab" id="abGren"><div class="abk">G</div><div class="abn">آنزیم</div><div class="abcd" id="grenadeEl">3</div></div>
  </div>

 const tw=Math.max(30,Math.ceil(m.measureText(text).width));

 x.strokeStyle='rgba(255,190,140,.35)';x.lineWidth=2;x.stroke();

const FLOWS=[];
function setupFlow(pts,colA,colB,n=38){
 const segs=[];let total=0;
 for(let i=0;i<pts.length-1;i++){const L=pts[i].distanceTo(pts[i+1]);segs.push(L);total+=L}
 const f={pts,segs,total,colA:new THREE.Color(colA),colB:new THREE.Color(colB),parts:[]};
 for(let i=0;i<n;i++){
  const mat=new THREE.MeshBasicMaterial({transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
  const m=new THREE.Mesh(partGeoShared,mat);m.scale.setScalar(.1);
  f.parts.push({mesh:m,mat,t:Math.random(),sp:rand(.85,1.15)});
  scene.add(m);
 }
 FLOWS.push(f);
}
const partGeoShared=new THREE.SphereGeometry(1,6,5);
const _fp=new V3();
function flowPos(f,t,out){
 let d=t*f.total;
 for(let i=0;i<f.segs.length;i++){
  if(d<=f.segs[i])return out.lerpVectors(f.pts[i],f.pts[i+1],d/f.segs[i]);
  d-=f.segs[i];
 }
 return out.copy(f.pts[f.pts.length-1]);
}
function updateFlows(dt){
 const sp=(state.weather==='rain'?1.9:1)*(1+state.flowBoost);
 for(const f of FLOWS)for(const p of f.parts){
  p.t+=dt*sp*p.sp*7/f.total;
  if(p.t>1)p.t-=1;
  flowPos(f,p.t,_fp);
  p.mesh.position.copy(_fp);
  p.mesh.position.y+=Math.sin(state.time*4+p.t*20)*.1;
  p.mat.color.lerpColors(f.colA,f.colB,p.t);
 }
 state.flowBoost=Math.max(0,state.flowBoost-dt*.4);
}

function resolveCircle(pos,r){
 for(let pass=0;pass<2;pass++){
  const check=(w)=>{const nx=clamp(pos.x,w.x,w.x+w.w),nz=clamp(pos.z,w.z,w.z+w.d);const dx=pos.x-nx,dz=pos.z-nz;const d2=dx*dx+dz*dz;
   if(d2<r*r){if(d2>.0001){const d=Math.sqrt(d2),push=(r-d)/d;pos.x+=dx*push;pos.z+=dz*push}else{const l=pos.x-w.x,rr=w.x+w.w-pos.x,t=pos.z-w.z,b=w.z+w.d-pos.z;const mn=Math.min(l,rr,t,b);if(mn===l)pos.x=w.x-r;else if(mn===rr)pos.x=w.x+w.w+r;else if(mn===t)pos.z=w.z-r;else pos.z=w.z+w.d+r}}};
  for(const w of walls)check(w);
  for(const p of props)check({x:p.x-p.r,z:p.z-p.r,w:p.r*2,d:p.r*2});
 }
}
function hitsWall(x,z,r,incProps=true){
 for(const w of walls)if(x+r>w.x&&x-r<w.x+w.w&&z+r>w.z&&z-r<w.z+w.d)return true;
 if(incProps)for(const p of props)if(x+r>p.x-p.r&&x-r<p.x+p.r&&z+r>p.z-p.r&&z-r<p.z+p.r)return true;
 return false;
}
function findFreeSpot(r,minP=8){

  if(Math.hypot(x-player.pos.x,z-player.pos.z)<minP)continue;
  if(!hitsWall(x,z,r))return{x,z}}
 return{x:0,z:-20};
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;
  if(p.userData.life<=0){scene.remove(p);p.material.dispose();particles.splice(i,1);continue}
  const u=p.userData;u.vy-=u.gravity*dt;p.position.x+=u.vx*dt;p.position.y+=u.vy*dt;p.position.z+=u.vz*dt;
  if(u.rx){p.rotation.x+=u.rx*dt;p.rotation.y+=u.ry*dt}
  if(p.position.y<.06){p.position.y=.06;u.vy*=-.3;u.vx*=.7;u.vz*=.7}
  const t=u.life/u.maxLife;p.material.opacity=t;}
}

function checkLOS(e,tp){
 const from=new V3(e.obj.position.x,e.t.size[1]*.7,e.obj.position.z);
 const steps=Math.ceil(from.distanceTo(tp)/2);
 for(let i=1;i<steps;i++){const t=i/steps;const p=from.clone().lerp(tp,t);if(hitsWall(p.x,p.z,.1,false))return false}
 return true;
}
function updateEnemies(dt){
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  if(e.hp<=0)continue;
  if(e.spawnT<.35){e.spawnT+=dt;e.obj.scale.setScalar(e.baseS*Math.min(1,e.spawnT/.35));continue}
  if(e.hitFlash>0){e.hitFlash-=dt;e.body.material.emissive.setHex(e.hitFlash>0?0x552222:0x000000)}
  if(e.isElite&&e.crown)e.crown.rotation.z+=dt*2;
  if(Math.abs(e.kbx)+Math.abs(e.kbz)>.05){
   const nx=e.obj.position.x+e.kbx*dt,nz=e.obj.position.z+e.kbz*dt;
   if(!hitsWall(nx,nz,.5)){e.obj.position.x=nx;e.obj.position.z=nz}
   e.kbx*=Math.exp(-6*dt);e.kbz*=Math.exp(-6*dt);
  }
  const dx=player.pos.x-e.obj.position.x,dz=player.pos.z-e.obj.position.z;
  const dist=Math.hypot(dx,dz);
  e.losTimer-=dt;
  if(e.losTimer<=0){e.losTimer=.12;e.los=player.alive&&player.invisTime<=0&&dist<65&&checkLOS(e,new V3(player.pos.x,player.pos.y-.6,player.pos.z))}
  if(e.los){if(!e.seen)e.reactT=.4;e.seen=true;e.lastSeen.set(player.pos.x,1.5,player.pos.z)}
  e.reactT-=dt;
  if(Math.abs(dx)+Math.abs(dz)>.1)e.obj.rotation.y=Math.atan2(dx,dz);
  let vx=0,vz=0;const canChase=e.t.id!=='dummy';
  if(e.seen&&e.los&&canChase&&e.speed>0){
   if(dist>e.t.keep+1.5){vx=(dx/dist)*e.speed*dt;vz=(dz/dist)*e.speed*dt}
   else if(dist<e.t.keep-1.5){vx=-(dx/dist)*e.speed*.7*dt;vz=-(dz/dist)*e.speed*.7*dt}
   else{e.strafeT-=dt;if(e.strafeT<=0){e.strafeDir*=-1;e.strafeT=rand(.6,1.5)}vx=(-dz/dist)*e.strafeDir*e.speed*.6*dt;vz=(dx/dist)*e.strafeDir*e.speed*.6*dt}
  }else if(e.seen&&canChase&&!e.los&&e.speed>0){
   const lx=e.lastSeen.x-e.obj.position.x,lz=e.lastSeen.z-e.obj.position.z;const ld=Math.hypot(lx,lz);
   if(ld>1){vx=(lx/ld)*e.speed*dt;vz=(lz/ld)*e.speed*dt}
  }
  for(let j=0;j<enemies.length;j++){if(j===i)continue;const o=enemies[j];
   const ox=e.obj.position.x-o.obj.position.x,oz=e.obj.position.z-o.obj.position.z;const od=Math.hypot(ox,oz);
   if(od>0&&od<1.4){vx+=ox/od*.9*dt;vz+=oz/od*.9*dt}}
  const nX=e.obj.position.x+vx,nZ=e.obj.position.z+vz;
  if(!hitsWall(nX,nZ,.5)){e.obj.position.x=nX;e.obj.position.z=nZ}
  else{const aX=e.obj.position.x-vz,aZ=e.obj.position.z+vx;if(!hitsWall(aX,aZ,.5)){e.obj.position.x=aX;e.obj.position.z=aZ}}
  const mv=Math.hypot(vx,vz)/Math.max(dt,.001);
  if(mv>.3){e.phase+=dt*e.speed*2.4;const s=Math.sin(e.phase);
   e.legL.rotation.x=s*.55;e.legR.rotation.x=-s*.55;e.armL.rotation.x=-s*.4;e.armR.rotation.x=s*.4;
   e.obj.position.y=Math.abs(s)*.05}
  else{e.legL.rotation.x*=.9;e.legR.rotation.x*=.9;e.armL.rotation.x*=.9;e.armR.rotation.x*=.9}
  e.fireCd-=dt;
  if(e.los&&dist<e.t.range&&e.fireCd<=0&&e.reactT<=0&&player.alive&&state.mode==='playing'){
   e.fireCd=e.t.rate*rand(.85,1.15);
   if(e.t.melee){if(dist<2.3){damagePlayer(e.t.dmg*diffM().dmg,e.obj.position);spawnParticles(player.pos.clone(),5,0x4a7a3a,3,.3,.07)}}
   else enemyFire(e,dx,dz,dist);
  }
 }
}
function enemyFire(e,dx,dz,dist){
 const from=new V3(e.obj.position.x+Math.sin(e.obj.rotation.y)*.7,e.t.size[1]*.7,e.obj.position.z+Math.cos(e.obj.rotation.y)*.7);
 const hitChance=clamp(1-dist/e.t.range,.15,1)*(1-e.t.acc*.5)+e.t.acc*.5;
 const hit=Math.random()<hitChance;
 const to=hit?player.pos.clone():player.pos.clone().add(new V3(rand(-2,2),rand(-1,1),rand(-2,2)));
 spawnTracerB(from,to.clone().sub(from).normalize(),from.distanceTo(to),0xff8855);
 addTempLight(from,0xffaa44,5,5,.07);

function damageEnemy(e,dmg,crit,dir){
 if(e.dying)return;
 /* در آزمون، هدفِ نادرست آسیب نمی‌بیند */
 if(e.examLetter!==undefined&&state.sel.mode==='exam'&&state.exam&&e.examLetter!==state.exam.correctLetter)return;
 if(e.t.armor)dmg*=(1-e.t.armor);
 e.hp-=dmg;e.hitFlash=.15;state.hitMarker=.14;
 if(dir){const kb=e.type==='boss'?0:e.type==='heavy'?.35:1.1;e.kbx+=dir.x*kb;e.kbz+=dir.z*kb}
 if(crit)SFX.crit();else SFX.hit();
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e,cause){

/* ================= شلیک ================= */
const ray=new THREE.Raycaster();
function playerShoot(){
 const w=WEAPONS[player.weapon];const st=player.weapons[player.weapon];
 if(!w.melee&&st.mag<=0){SFX.empty();tryReload();return}
 if(!w.melee)st.mag--;
 const od=player.ultActive>0&&state.sel.cls==='assault';
 player.fireCd=w.rate/(od?1.5:1);
 player.kick=Math.min(player.kick+(w.recoil||.3),.9);
 player.pitch=Math.min(player.pitch+(w.recoil||.3)*.007,1.5);
 muzzleLight.intensity=9;
 if(vmFlash){vmFlash.visible=true;vmFlash.rotation.z=rand(0,TAU);vmFlash.scale.setScalar(rand(.8,1.4));muzzleT=.05}
 if(!w.melee)spawnCasing();
 w.sfx();
 state.weaponsUsed[w.id]=1;
 const origin=new V3();camera.getWorldPosition(origin);
 const baseDir=new V3();camera.getWorldDirection(baseDir);
 const hittables=[ground];
 for(const e of enemies){hittables.push(e.hitbox,e.headMesh)}
 for(const wl of walls)hittables.push(wl.mesh);
 for(const pr of props)hittables.push(pr.mesh);
 state.shotsFired+=w.pellets;
 const spreadNow=w.spread*(1-adsT*.75)*(player.onGround?1:1.7)*(player.crouch?.65:1);
 for(let p=0;p<w.pellets;p++){
  const dir=baseDir.clone();
  dir.x+=rand(-1,1)*spreadNow*2.5;dir.y+=rand(-1,1)*spreadNow*2.5;dir.z+=rand(-1,1)*spreadNow*2.5;
  dir.normalize();
  ray.set(origin,dir);ray.far=w.range;
  const hits=ray.intersectObjects(hittables,false);
  spawnTracerB(origin,dir,hits.length?Math.min(hits[0].distance,w.range):w.range);
  if(!hits.length)continue;
  const h=hits[0];const ent=h.object.userData.ent;
  if(ent&&ent.kind==='enemy'){
   const e=ent.e;const isHead=!!ent.head;
   /* حالت آزمون: شلیک به گزینه */
   if(state.sel.mode==='exam'&&e.examLetter!==undefined&&state.exam){
    if(e.examLetter!==state.exam.correctLetter){
     damagePlayer(10,e.obj.position);
     toast('❌ پاسخ نادرست!','درست: '+state.exam.qs[state.exam.idx].o[state.exam.correctLetter]);
     SFX.wrong();shake(.25);e.hitFlash=.35;
     continue;
    }
   }
   let dmg=w.dmg*(1+player.dmgBonus*.05)*(od?2:1);
   if(Math.random()<(.15+player.critBonus))dmg*=2;
   if(isHead)dmg*=3;
   state.shotsHit++;state.damageDealt+=dmg;
   damageEnemy(e,dmg,isHead||Math.random()<.15,dir);
   showHitmarker();showDmgNumber(h.point,dmg,isHead);
   spawnParticles(h.point,6,0xaa1122,4,.35,.06,10);
   addBloodSplat(e);
   if(isHead){state.headshots++;Progress.recordHeadshot();voiceSay('headshot');Progress.updateDaily('headshots',1)}
  }else if(ent&&ent.kind==='prop'){
   damageProp(ent.p,w.dmg);spawnParticles(h.point,5,0xc89090,3,.3,.05);addBulletHole(h);
  }else{
   spawnParticles(h.point,4,h.object===ground?0x8a5a60:0xffc86b,3,.25,.05,8);addBulletHole(h);
  }
 }
 updateAmmoHUD();
}
function tryReload(){
 const w=WEAPONS[player.weapon];if(w.melee)return;
 const st=player.weapons[player.weapon];
 if(player.reloading||st.mag>=w.mag||st.reserve<=0)return;
 player.reloading=true;player.reloadT=w.reload*(1-player.reloadBonus);
 $('reloadWrap').classList.remove('hidden');SFX.reload();
}
function finishReload(){
 const w=WEAPONS[player.weapon];const st=player.weapons[player.weapon];
 const need=w.mag-st.mag;const take=Math.min(need,st.reserve);
 st.mag+=take;st.reserve-=take;

 updateAmmoHUD();
}

 const dir=new V3();camera.getWorldDirection(dir);
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),new THREE.MeshStandardMaterial({color:0x2a4a2a,roughness:.5,metalness:.4}));
 mesh.position.copy(camera.position).addScaledVector(dir,.5);mesh.castShadow=true;scene.add(mesh);
 grenades.push({mesh,vel:dir.clone().multiplyScalar(16).add(new V3(0,3.5,0)).add(player.vel.clone().multiplyScalar(.4)),timer:2.2});

function updateGrenades(dt){
 for(let i=grenades.length-1;i>=0;i--){const g=grenades[i];
  g.vel.y-=18*dt;
  const nx=g.mesh.position.x+g.vel.x*dt,nz=g.mesh.position.z+g.vel.z*dt;
  if(hitsWall(nx,g.mesh.position.z,.15)){g.vel.x*=-.4}else g.mesh.position.x=nx;
  if(hitsWall(g.mesh.position.x,nz,.15)){g.vel.z*=-.4}else g.mesh.position.z=nz;
  g.mesh.position.y+=g.vel.y*dt;
  if(g.mesh.position.y<.13){g.mesh.position.y=.13;if(Math.abs(g.vel.y)>1)beep('triangle',300,100,.04,.04);g.vel.y*=-.35;g.vel.x*=.7;g.vel.z*=.7}
  g.mesh.rotation.x+=dt*6;

  if(g.timer<=0){scene.remove(g.mesh);grenades.splice(i,1);explode(g.mesh.position,6,95,'grenade')}
 }

function explode(pos,radius,dmg,cause){
 SFX.explode();shake(.45);
 spawnParticles(pos,26,0xff7a20,9,.7,.16,7,false,true);
 spawnParticles(pos,14,0x3a1518,3,1.4,.22,2);
 spawnParticles(pos,12,0xffc93c,12,.4,.06,10,false,true);
 addTempLight(pos,0xffaa44,60,radius*3,.15);
 addScorch(pos);
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
  const d=Math.hypot(e.obj.position.x-pos.x,e.obj.position.z-pos.z);
  if(d<radius){damageEnemy(e,dmg*(1-d/radius*.7),false,null);if(e.hp<=0&&!e.dying)killEnemy(e,cause)}
 }
 for(let i=props.length-1;i>=0;i--){const p=props[i];
  const d=Math.hypot(p.x-pos.x,p.z-pos.z);
  if(d<radius)damageProp(p,dmg);
 }
 const pd=Math.hypot(player.pos.x-pos.x,player.pos.z-pos.z);
 if(pd<radius)damagePlayer(dmg*.45*(1-pd/radius),pos);
}

function tryDash(){

 let fx=0,fz=0;
 if(!state.chatOpen){if(keys.KeyW)fz-=1;if(keys.KeyS)fz+=1;if(keys.KeyA)fx-=1;if(keys.KeyD)fx+=1}
 if(!fx&&!fz){fx=-Math.sin(player.yaw);fz=-Math.cos(player.yaw)}
 else{const l=Math.hypot(fx,fz);fx/=l;fz/=l;
  const wx=fx*Math.cos(player.yaw)-fz*Math.sin(player.yaw);
  const wz=fx*Math.sin(player.yaw)+fz*Math.cos(player.yaw);fx=wx;fz=wz}
 player.dashDir.set(fx,0,fz).normalize();
 player.dashTime=.18;player.dashCd=3;player.invuln=Math.max(player.invuln,.25);
 SFX.dash();spawnParticles(player.pos.clone(),10,0xff7a8a,5,.35,.1);
}

}

function updateWeather(dt){
 if(rain.visible){
  const p=rainGeo.attributes.position.array;

   let y=p[i*6+1]-32*dt;
   if(y<0){y=rand(22,38);p[i*6]=player.pos.x+rand(-60,60);p[i*6+2]=player.pos.z+rand(-60,60)}
   p[i*6+1]=y;p[i*6+4]=y-1.1;p[i*6+3]=p[i*6]+.3;p[i*6+5]=p[i*6+2];
  }

 }

   p[i*3+1]-=dt*3.5;p[i*3]+=Math.sin(state.time+i)*dt*.4;

/* ================= ضربان قلب محیطی + ECG ================= */
function updatePulse(dt){
 if(state.mode==='playing'){
  state.bpm=72+(player.sprint?22:0)+clamp((1-player.hp/player.maxHp)*38,0,38)+(enemies.some(e=>e.type==='boss')?14:0);
 }
 const rate=(state.bpm||72)/60;
 const prev=state.pulse;state.pulse=(state.pulse+dt*rate)%1;
 if(state.pulse<prev&&state.mode==='playing')SFX.heart();
 const p=state.pulse;
 const spike=Math.exp(-Math.pow((p-.22)/.06,2));
 const wave=spike+Math.exp(-Math.pow((p-.45)/.08,2))*.25;
 if(SETTINGS.pulse){
  sun.intensity=sun.userData.base*(1+wave*.35);
  hemi.intensity=hemi.userData.base*(1+wave*.25);
  skyU.bottomColor.value.copy(botBase).lerp(botHot,Math.min(1,wave*.6));
 }
}
function ecgVal(t){
 let v=0;
 v+=Math.exp(-Math.pow((t-.12)/.045,2))*.12;
 v+=-Math.exp(-Math.pow((t-.20)/.02,2))*.12;
 v+=Math.exp(-Math.pow((t-.225)/.022,2))*.9;
 v+=-Math.exp(-Math.pow((t-.25)/.02,2))*.22;
 v+=Math.exp(-Math.pow((t-.42)/.07,2))*.22;
 if(player.hp<30&&Math.random()<.06)v+=rand(-.6,.7);
 if(state.weather==='storm')v+=rand(-.12,.12);
 return v;
}
const ecgCtx=$('ecg').getContext('2d');
function drawECG(){
 const c=ecgCtx,W=230,H=22;
 c.clearRect(0,0,W,H);
 c.fillStyle='rgba(10,4,7,.6)';c.fillRect(0,0,W,H);
 c.strokeStyle='#39ff88';c.lineWidth=1.4;c.beginPath();
 const rate=(state.bpm||72)/60;
 for(let x=0;x<W;x++){
  let t=(state.pulse-((W-1-x)*.014*rate))%1;if(t<0)t+=1;
  const y=H*.65-ecgVal(t)*H*.5;
  x===0?c.moveTo(x,y):c.lineTo(x,y);
 }
 c.stroke();
 c.fillStyle='#8cebff';c.font='bold 9px Tahoma';c.textAlign='left';
 c.fillText(Math.round(state.bpm||72)+' bpm 🫀',6,10);
}

const mmCtx=$('minimap').getContext('2d');
function drawMinimap(){
 const c=mmCtx,S=140,cx=S/2,scale=1.15;
 c.clearRect(0,0,S,S);
 c.save();c.beginPath();c.arc(cx,cx,cx-3,0,TAU);c.clip();
 c.translate(cx,cx);c.rotate(player.yaw);
 const px=player.pos.x,pz=player.pos.z;
 c.fillStyle='rgba(190,120,140,.28)';
 for(const w of walls)c.fillRect((w.x-px)*scale,(w.z-pz)*scale,w.w*scale,w.d*scale);
 c.fillStyle='rgba(160,100,120,.4)';
 for(const p of props)c.fillRect((p.x-p.r-px)*scale,(p.z-p.r-pz)*scale,p.r*2*scale,p.r*2*scale);
 const dot=(x,z,col,r)=>{let dx=(x-px)*scale,dz=(z-pz)*scale;const d=Math.hypot(dx,dz);if(d>cx-8){dx*=(cx-8)/d;dz*=(cx-8)/d}c.fillStyle=col;c.beginPath();c.arc(dx,dz,r,0,TAU);c.fill()};
 for(const e of enemies)dot(e.obj.position.x,e.obj.position.z,e.type==='boss'?'#ff3355':e.isElite?'#ff9c2e':e.examLetter!==undefined?'#6fd3ff':'#ff5555',e.type==='boss'?5:3);
 for(const p of pickups)dot(p.mesh.position.x,p.mesh.position.z,'#ffc93c',2.5);
 for(const a of airdrops)dot(a.x,a.z,'#6fd3ff',4);
 for(const s of stations)dot(s.obj.position.x,s.obj.position.z,Progress.data.readCards.includes(s.id)?'#8a8a8a':'#ffd24a',3);
 if(turret)dot(turret.group.position.x,turret.group.position.z,'#4fe08a',3.5);
 if(drone)dot(drone.group.position.x,drone.group.position.z,'#00ffcc',3);
 c.restore();
 const sw=(state.time*1.5)%TAU;
 const grd=c.createLinearGradient(cx,cx,cx+Math.cos(sw)*cx,cx+Math.sin(sw)*cx);
 grd.addColorStop(0,'rgba(111,211,255,0)');grd.addColorStop(1,'rgba(111,211,255,.35)');
 c.strokeStyle=grd;c.lineWidth=2;c.beginPath();c.moveTo(cx,cx);c.lineTo(cx+Math.cos(sw)*(cx-4),cx+Math.sin(sw)*(cx-4));c.stroke();
 c.fillStyle='#fff';c.beginPath();c.moveTo(cx,cx-7);c.lineTo(cx-5,cx+5);c.lineTo(cx+5,cx+5);c.closePath();c.fill();
}

function nearestStation(){

 let best=null,bd=3;
 for(const s of stations){
  const d=Math.hypot(s.obj.position.x-player.pos.x,s.obj.position.z-player.pos.z);
  if(d<bd){bd=d;best=s}
 }
 return best;
}

 player.pos.set(mp.start?mp.start[0]:0,1.65,mp.start?mp.start[1]:0);

 player.shieldTime=0;player.invisTime=0;player.regenTime=0;player.lastDamaged=99;

 applyClassSkills();

 const wSel=state.sel.weather==='random'?['clear','rain','fog','storm','snow'][Math.floor(rand(0,5))]:state.sel.weather;
 setWeather(wSel);
 buildViewModel(0);

 updateBars();updateChips();updateAmmoHUD();updateAbilityHUD();
 startRound(1);
}
function startRound(n){
 state.round=n;state.betweenRounds=false;
 const gm=state.sel.mode;
 if(gm==='exam'){
  toast('آزمون زیست شروع!','۱۰ پرسش — به پاسخ درست شلیک کن');
  startExam();updateChips();updateBars();
  return;
 }
 toast('مرحله '+n,gm==='zombie'?'موج عفونت':gm==='training'?'تیراندازی آزاد — مهمات بی‌نهایت':'میکروب‌ها در حال حمله!');
 if(gm==='zombie')voiceSay('zombie');
 player.hp=Math.min(player.maxHp,player.hp+15);
 const dm=diffM();
 const hpMul=1+(n-1)*.12;
 if(gm==='survival'){
  const count=Math.min(18,Math.round((SETTINGS.enemyCount+n*1.5)*dm.cnt));
  const isBoss=n%5===0;
  for(let i=0;i<count;i++){
   let t='grunt';
   if(n>=2&&Math.random()<.3)t='scout';
   if(n>=3&&Math.random()<.2)t='sniper';
   if(n>=4&&Math.random()<.18)t='heavy';
   spawnEnemy(t,Math.random()<.08+n*.005,hpMul);
  }
  if(isBoss)spawnEnemy('boss',false,hpMul*.8);
 }else if(gm==='zombie'){
  const count=Math.min(24,Math.round((6+n*2)*dm.cnt));
  for(let i=0;i<count;i++)spawnEnemy('zombie',Math.random()<.08,hpMul);
  if(n>=10)Progress.recordStat('zombieWaves',n,true);
 }else if(gm==='horde'){
  const count=Math.min(26,Math.round((8+n*2)*dm.cnt));
  for(let i=0;i<count;i++){
   const r=Math.random();
   spawnEnemy(r<.5?'grunt':r<.75?'scout':r<.9?'heavy':'sniper',Math.random()<.15,hpMul);
  }
  if(n%4===0)spawnEnemy('boss',false,hpMul*.7);
  if(Math.random()<.5)spawnHazard();
  spawnAirdrop();
 }else if(gm==='timetrial'){
  for(let i=0;i<20;i++){const r=Math.random();spawnEnemy(r<.5?'grunt':r<.8?'scout':'sniper',false,1)}
 }else if(gm==='training'){
  for(let i=0;i<6;i++)spawnEnemy('dummy',false,1);
 }
 updateChips();updateBars();
}
function checkRoundEnd(){
 if(state.mode!=='playing'||state.betweenRounds)return;
 if(enemies.length>0)return;
 const gm=state.sel.mode;
 if(gm==='timetrial'){gameOver(true);return}
 if(gm==='training')return;
 if(gm==='exam'){
  state.betweenRounds=true;state.roundBreakT=2.2;
  state.exam.correct++;
  SFX.correct();
  toast('✅ درست!','امتیاز +۱');
  return;
 }
 state.betweenRounds=true;state.roundBreakT=4;
 toast('مرحله پاک شد!','+۱۵ سلامت');
 if(gm==='survival'&&Math.random()<.5)spawnAirdrop();
 if(gm==='horde'&&Math.random()<.4)spawnHazard();
 if(['survival','zombie','horde'].includes(gm))showQuiz();
}
function updateRoundFlow(dt){
 if(state.betweenRounds){state.roundBreakT-=dt;
  if(state.roundBreakT<=0){
   if(state.sel.mode==='exam')examAdvance();
   else startRound(state.round+1);
  }}
 if(state.sel.mode==='training'){
  if(enemies.length<6){state.dummyT-=dt;if(state.dummyT<=0){state.dummyT=2.5;spawnEnemy('dummy',false,1)}}
  player.weapons.forEach((st,i)=>st.reserve=WEAPONS[i].resMax);
 }
}
function gameOver(win){
 if(state.mode!=='playing')return;
 state.mode='gameover';
 document.exitPointerLock&&document.exitPointerLock();
 mouseDown=false;
 const acc=state.shotsFired>0?Math.round(state.shotsHit/state.shotsFired*100):0;
 if(state.sel.mode==='timetrial'){
  if(win){Progress.recordStat('bestTime',Math.round(state.time),true);state.score+=Math.max(0,2000-Math.round(state.time)*10)}
 }
 if(state.sel.mode==='exam'&&state.exam){
  Progress.data.coins+=state.exam.correct*15;
  Progress.addXP(state.exam.correct*30);
 }
 Progress.addScore({name:playerName,score:state.score,mode:MODES[state.sel.mode],round:state.round});
 Progress.recordStat('bestStreak',state.bestStreak,true);
 const unlocked=Progress.checkAchievements({kills:state.kills,noDamage:state.totalDamage===0&&state.round>1,round:state.round,weaponsUsed:Object.keys(state.weaponsUsed).length});
 for(const a of unlocked){showAchievement(a.name);SFX.achieve()}
 Progress.save();
 if(win)SFX.win();
 $('hud').classList.add('hidden');$('crosshair').classList.add('hidden');$('scopeOverlay').classList.add('hidden');
 $('examPanel').classList.add('hidden');$('hint').classList.remove('show');
 showGameOverPanel(win,acc);
}
function pauseGame(){
 if(state.mode!=='playing')return;
 state.mode='paused';

}
function resumeGame(){

 const q=SETTINGS.quality;
 const pr={low:1,medium:1.5,high:2,ultra:2}[q]||2;
 renderer.setPixelRatio(Math.min(devicePixelRatio,pr));
 renderer.setSize(innerWidth,innerHeight);
 const sh={low:0,medium:1024,high:2048,ultra:2048}[q];
 renderer.shadowMap.enabled=sh>0&&SETTINGS.shadows;
 sun.castShadow=sh>0&&SETTINGS.shadows;
 if(sh>0){sun.shadow.mapSize.set(sh,sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
 const cc={low:0,medium:4,high:7,ultra:10}[q];
 clouds.forEach((c,i)=>c.visible=i<cc);
 if(bloomPass)bloomPass.strength={low:0,medium:.25,high:.5,ultra:.65}[q];
 if(composer)composer.setSize(innerWidth,innerHeight);
 $('fpsChip').classList.toggle('hidden',!SETTINGS.showFps);
}
function showPausePanel(){
 $('overlay').classList.remove('hide');
 $('panel').innerHTML=`<h2>⏸ توقف</h2>
 <div class="statline">امتیاز: <b>${state.score}</b> • مرحله: <b>${state.round}</b> • میکروب: <b>${state.kills}</b></div>
 ${state.exam?`<div class="statline">آزمون: <b>${state.exam.correct} درست از ${state.exam.idx}</b></div>`:''}
 <button class="gold" id="resBtn" style="font-size:14px">▶ ادامه مأموریت</button><br>
 <button class="alt" id="setBtn">⚙️ تنظیمات</button>
 <button class="alt" id="libBtn">📚 کتابخانه قلب</button>
 <button class="danger" id="quitBtn">🚪 خروج به منو</button>`;
 $('resBtn').onclick=resumeGame;
 $('setBtn').onclick=()=>showSettings('pause');
 $('libBtn').onclick=()=>{showLibrary()};
 $('quitBtn').onclick=quitToMenu;
}
function showGameOverPanel(win,acc){
 const coinsEarned=Progress.data.coins-state.coinsStart;
 let examBlock='';
 if(state.exam){
  const grade=(state.exam.correct/state.exam.total*20).toFixed(1);
  examBlock=`<h3 style="text-align:center">📝 نتیجه آزمون زیست</h3>
  <div class="statline" style="font-size:15px">پاسخ‌های درست: <b>${state.exam.correct} از ${state.exam.total}</b></div>
  <div class="statline gold" style="font-size:17px">نمره زیست: <b>${grade} از ۲۰</b> ${state.exam.correct>=9?'🏆':state.exam.correct>=7?'👍':'📚'}</div>`;
 }
 $('overlay').classList.remove('hide');
 $('panel').innerHTML=`<h1 style="color:${win?'#7bff9c':'#ff6b6b'}">${win?'🏆 مأموریت کامل شد!':'☠️ نانوبات از کار افتاد'}</h1>
 ${examBlock}
 <h3 style="text-align:center">خلاصه مأموریت</h3>
 <div class="statline">امتیاز درمان: <b>${state.score}</b> • مرحله: <b>${state.round}</b> • مدت: <b>${Math.floor(state.time)} ثانیه</b></div>
 <div class="statline">میکروب‌های نابودشده: <b>${state.kills}</b> • هدف‌گیری دقیق: <b>${state.headshots}</b> • دقت: <b>${acc}%</b></div>
 <div class="statline">بهترین رشته: <b>${state.bestStreak}</b> • آسیب واردشده: <b>${Math.round(state.damageDealt)}</b> • کپسول آنزیم: <b>${state.grenadesUsed}</b></div>
 <div class="statline">کوییز این بازی — درست: <b style="color:#7bff9c">${state._quizRight||0}</b> • نادرست: <b style="color:#ff9c9c">${state._quizWrong||0}</b></div>
 <div class="statline gold">دانش کسب‌شده: <b>+${Math.max(0,Progress.data.xp-state.xpStart)}</b> • ATP: <b>+${Math.max(0,coinsEarned)}</b></div>
 ${state.sel.mode==='timetrial'?`<div class="statline">زمان پایان: <b>${Math.round(state.time)} ثانیه</b></div>`:''}
 <button class="gold" id="retryBtn" style="font-size:14px">↻ مأموریت دوباره</button>
 <button class="alt" id="menuBtn">منوی اصلی</button>`;
 $('retryBtn').onclick=startGame;
 $('menuBtn').onclick=quitToMenu;
}

/* ================= موبایل ================= */
function initMobile(){
 if(!isTouch)return;
 document.body.classList.add('mobile');
 ['joyL','joyR','mFire','mJump','mReload','mNade','mSwap'].forEach(id=>$(id).classList.remove('hidden'));
 const move={x:0,y:0},look={x:0,y:0};
 const joy=(el,cb)=>{
  const knob=el.querySelector('.knob');let active=false;
  const set=(e)=>{const t=e.touches?e.touches[0]:e;const r=el.getBoundingClientRect();
   let dx=(t.clientX-r.left-r.width/2)/(r.width/2),dy=(t.clientY-r.top-r.height/2)/(r.height/2);
   const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
   knob.style.transform=`translate(calc(-50% + ${dx*35}px),calc(-50% + ${dy*35}px))`;cb(dx,dy)};
  el.addEventListener('touchstart',e=>{active=true;set(e);e.preventDefault()},{passive:false});
  el.addEventListener('touchmove',e=>{if(active)set(e);e.preventDefault()},{passive:false});
  el.addEventListener('touchend',()=>{active=false;knob.style.transform='translate(-50%,-50%)';cb(0,0)});
 };
 joy($('joyL'),(x,y)=>{move.x=x;move.y=y});
 joy($('joyR'),(x,y)=>{look.x=x;look.y=y});
 window._mob={move,look};
 const btn=(id,down,up)=>{const el=$(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();initAudio();down()},{passive:false});
  if(up)el.addEventListener('touchend',e=>{e.preventDefault();up()},{passive:false})};
 btn($('mFire'),()=>mouseDown=true,()=>mouseDown=false);
 btn($('mJump'),()=>{if(player.onGround||player.jumps<2){player.vel.y=SETTINGS.jumpPower*(player.jumps>0?.85:1);player.jumps++;player.onGround=false}});
 btn($('mReload'),()=>tryReload());
 btn($('mNade'),()=>throwGrenade());
 btn($('mSwap'),()=>switchWeapon((player.weapon+1)%WEAPONS.length));
}
initMobile();

/* ================= به‌روزرسانی بازیکن ================= */
function updatePlayer(dt){
 if(!player.alive)return;
 player.invuln-=dt;player.dashCd-=dt;player.healCd-=dt;player.ultCd-=dt;player.grenCd-=dt;
 player.ultActive-=dt;player.shieldTime-=dt;player.invisTime-=dt;player.regenTime-=dt;
 player.lastDamaged+=dt;player.emoteT-=dt;
 if(player.regenTime>0)player.hp=Math.min(player.maxHp,player.hp+5*dt);
 if(player.lastDamaged>5&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+2*dt);
 let fwd=0,right=0;
 if(!state.chatOpen){
  if(keys.KeyW)fwd+=1;if(keys.KeyS)fwd-=1;if(keys.KeyD)right+=1;if(keys.KeyA)right-=1;
  if(window._mob){fwd+=-window._mob.move.y;right+=window._mob.move.x}
 }
 player.crouch=!!(keys.ControlLeft||keys.KeyC)&&player.onGround;
 const sprint=player.sprint&&fwd>0&&player.stamina>0&&!player.crouch;
 if(sprint)player.stamina=Math.max(0,player.stamina-18*dt);else player.stamina=Math.min(100,player.stamina+12*dt);
 const spd=player.speed*(player.crouch?.5:1)*(sprint?1.55:1)*(player.ultActive>0&&state.sel.cls==='scout'?1.4:1);
 const f=new V3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
 const r=new V3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
 const wish=new V3().addScaledVector(f,fwd).addScaledVector(r,right);
 if(wish.lengthSq()>1)wish.normalize();
 if(player.dashTime>0){
  player.dashTime-=dt;
  player.vel.x=player.dashDir.x*22;player.vel.z=player.dashDir.z*22;
 }else{
  const k=1-Math.exp(-12*dt);
  player.vel.x=lerp(player.vel.x,wish.x*spd,k);
  player.vel.z=lerp(player.vel.z,wish.z*spd,k);
 }
 if(!state.chatOpen&&keys.Space&&(player.onGround||player.jumps<2)){
  player.vel.y=SETTINGS.jumpPower*(player.jumps>0?.85:1);
  player.jumps++;player.onGround=false;
  if(player.jumps===2)spawnParticles(player.pos.clone(),8,0xff9aa0,3,.4,.08,4);
 }
 player.vel.y-=SETTINGS.gravity*dt;
 const wasY=player.vel.y,wasGround=player.onGround;
 player.pos.x+=player.vel.x*dt;player.pos.z+=player.vel.z*dt;player.pos.y+=player.vel.y*dt;
 resolveCircle(player.pos,.42);
 player.pos.x=clamp(player.pos.x,-53,53);player.pos.z=clamp(player.pos.z,-53,53);
 const eyeT=player.crouch?1.05:1.65;
 player.eyeH=lerp(player.eyeH,eyeT,Math.min(1,dt*10));
 if(player.pos.y<=player.eyeH+.02){
  player.pos.y=player.eyeH;
  if(!wasGround&&wasY<-9){shake(.22);SFX.land();spawnParticles(new V3(player.pos.x,.1,player.pos.z),10,0x8a5a60,3,.4,.07)}
  if(!player.onGround){player.onGround=true;player.jumps=0}
  player.vel.y=0;
 }else player.onGround=false;
 const hsp=Math.hypot(player.vel.x,player.vel.z);
 if(player.onGround&&hsp>1){
  player.bobPhase+=dt*hsp*1.7;
  player.stepDist+=hsp*dt;
  if(player.stepDist>2.3){player.stepDist=0;SFX.footstep();spawnParticles(new V3(player.pos.x,.08,player.pos.z),3,0xa06a72,1.5,.3,.05,4)}
 }
}
function updateWeaponSys(dt){
 const w=WEAPONS[player.weapon];
 player.fireCd-=dt;
 if(player.reloading){player.reloadT-=dt;if(player.reloadT<=0)finishReload()}
 adsT=clamp(adsT+((rmb&&!player.reloading&&!w.melee)?dt*7:-dt*7),0,1);
 const scoped=w.id==='sniper'&&adsT>.85;
 $('scopeOverlay').classList.toggle('hidden',!scoped);
 if(vmGun)vmGun.visible=!scoped;
 $('crosshair').style.opacity=(state.photo||scoped)?0:(1-adsT*.5);
 muzzleT-=dt;if(muzzleT<=0&&vmFlash)vmFlash.visible=false;
 muzzleLight.intensity*=Math.exp(-14*dt);
 clickEdge=mouseDown&&!prevMouseDown;prevMouseDown=mouseDown;
 const want=mouseDown&&!player.reloading&&player.alive&&!state.chatOpen&&!scoped;
 if(want&&player.fireCd<=0){
  if(w.auto&&!player.burstMode)playerShoot();
  else if(clickEdge){playerShoot();if(w.auto)player.burstQueued=2}
  else if(player.burstQueued>0&&w.auto){playerShoot();player.burstQueued--}
 }
 player.kick*=Math.exp(-8*dt);
 if(vmHolder){
  const swayX=clamp(pmx*.0016,-.05,.05),swayY=clamp(pmy*.0016,-.04,.04);
  vmHolder.position.x=lerp(.26,0,adsT)+Math.sin(player.bobPhase)*.008*(1-adsT);
  vmHolder.position.y=lerp(-.26,-.2,adsT)+Math.abs(Math.cos(player.bobPhase))*.006*(1-adsT);
  vmHolder.position.z=-.5+player.kick*.07;
  vmHolder.rotation.x=player.kick*.14+swayY;
  vmHolder.rotation.y=lerp(-.05,0,adsT)+swayX;
  vmHolder.rotation.z=player.emoteT>0?Math.sin(player.emoteT*10)*.5:0;
 }
}
function updateCamera(dt){
 if(state.mode==='menu'){
  state.menuAng+=dt*.06;
  camera.position.set(Math.sin(state.menuAng)*26,9,Math.cos(state.menuAng)*26);
  camera.lookAt(0,2,0);
  if(vmHolder)vmHolder.visible=false;
  return;
 }
 if(vmHolder)vmHolder.visible=true;
 camera.rotation.set(player.pitch,player.yaw,shakeAmp>0?rand(-1,1)*shakeAmp*.03:0);
 const bobY=player.onGround?Math.sin(player.bobPhase*2)*.028:0;
 camera.position.set(
  player.pos.x+(shakeAmp>0?rand(-1,1)*shakeAmp*.1:0),
  player.pos.y+bobY+(shakeAmp>0?rand(-1,1)*shakeAmp*.08:0),
  player.pos.z+(shakeAmp>0?rand(-1,1)*shakeAmp*.1:0)
 );
 const w=WEAPONS[player.weapon];
 const tf=lerp(SETTINGS.fov,w.zoom||50,adsT);
 camera.fov+=(tf-camera.fov)*Math.min(1,dt*10);
 camera.updateProjectionMatrix();
}

/* ================= حلقه اصلی ================= */
let last=performance.now(),chipT=0,puT2=0;
function loop(now){
 requestAnimationFrame(loop);
 let dt=Math.min((now-last)/1000,.05);last=now;
 state.frames++;state.fpsT+=dt;
 if(state.fpsT>=1){state.fps=state.frames;state.frames=0;state.fpsT=0;if(SETTINGS.showFps)$('fpsEl').textContent=state.fps}
 state.slowmo=Math.max(0,state.slowmo-dt);
 const ts=state.slowmo>0?.35:1;
 const wdt=dt*ts;
 if(state.mode==='playing'){
  state.time+=wdt;
  const sens=SETTINGS.sensitivity*.0022*(adsT>.5?.55:1);
  player.yaw-=pmx*sens;
  player.pitch-=pmy*sens*(SETTINGS.invertY?-1:1);
  player.pitch=clamp(player.pitch,-1.5,1.5);
  if(window._mob){player.yaw-=window._mob.look.x*dt*4;player.pitch=clamp(player.pitch-window._mob.look.y*dt*3,-1.5,1.5)}
  pmx=0;pmy=0;
  updatePlayer(wdt);
  updateWeaponSys(dt);
  updateEnemies(wdt);
  updateGrenades(wdt);
  updatePickups(wdt);
  updateAirdrops(wdt);
  updateHazards(wdt);
  updateTurret(wdt);
  updateDrone(wdt);
  updateCorpses(wdt);
  updateRoundFlow(wdt);
  state.comboT-=wdt;if(state.comboT<=0)state.combo=0;
  state.multiT-=wdt;if(state.multiT<=0)state.multi=0;
  Progress.recordPlaytime(wdt);
  if(Progress.dirty&&(state.time%5<wdt))Progress.save();
  const boss=enemies.find(e=>e.type==='boss');
  $('bossBar').classList.toggle('hidden',!boss);
  if(boss)$('bossFill').style.width=clamp(boss.hp/boss.maxHp,0,1)*100+'%';
  chipT-=dt;if(chipT<=0){chipT=.15;updateChips();updateBars();updateAbilityHUD()}
  puT2-=dt;if(puT2<=0){puT2=.3;updatePowerups()}
 }
 /* تایمر کوییز */
 if(state.mode==='quiz'&&state.quiz&&!state.quiz.answered){
  state.quiz.t-=dt;
  const el=$('quizTimer');
  if(el)el.style.width=Math.max(0,state.quiz.t*10)+'%';
  if(state.quiz.t<=0)answerQuiz(-1);
 }
 updateParticles(wdt);
 updateTracers(dt);
 updateTempLights(dt);
 updateWeather(wdt);
 updatePulse(dt);
 updateFlows(wdt);
 updateStations(dt);
 updateFX(dt);
 updateCamera(dt);
 if(state.mode==='playing'||state.mode==='paused'||state.mode==='quiz'||state.mode==='reading'){drawMinimap();drawECG()}
 if(composer&&SETTINGS.bloom&&SETTINGS.quality!=='low')composer.render();
 else renderer.render(scene,camera);
}
loadMap('heart');
setWeather('clear');
applyQuality();
showMenu();
requestAnimationFrame(loop);
setTimeout(()=>$('loading').classList.add('hidden'),600);
</script>
